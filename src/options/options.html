<!doctype html><html data-theme="system"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/style.css"><link rel="stylesheet" href="options.css"></head>
<body style="width:auto">
  <div class="page">
    <h2>Kite Bot Status</h2><div class="muted">Uses your Kite login in this browser.</div>
    <label for="theme">Theme</label>
    <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <div class="toggle-row" style="margin-top:20px"><input type="checkbox" id="quietEnabled"><label for="quietEnabled">Quiet hours (no notifications)</label></div>
    <div class="timerow" id="quietTimes"><div><label for="quietStart">From</label><input type="time" id="quietStart" value="22:00"></div><div><label for="quietEnd">Until</label><input type="time" id="quietEnd" value="07:00"></div></div>
    <label for="apiBase">API URL</label><input id="apiBase" placeholder="https://api.kite.onl">
    <label for="token">API token <span class="muted">(optional)</span></label><input id="token" type="password" placeholder="kite_...">
    <div class="muted small" style="margin-top:6px">Leave empty to use your Kite login. Only needed if you aren't logged in to Kite in this browser (user menu → API tokens).</div>
    <div class="toggle-row"><input type="checkbox" id="errorAlerts" checked><label for="errorAlerts">Notify me when new errors appear</label></div>
    <div class="btnrow"><button class="btn primary" id="save">Save &amp; connect</button><button class="btn" id="test" type="button">Test connection</button></div>
    <div id="msg" class="small status" role="status" aria-live="polite"></div>
    <div class="about small muted"><span>Kite Bot Status <b id="version"></b></span><span><a href="https://github.com/Jackappleteam/kite-status-extension" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/Jackappleteam/kite-status-extension/releases" target="_blank" rel="noopener">Changelog</a></span></div>
  </div>
  <script src="../shared/shared.js"></script><script src="options.js"></script>
</body></html>
