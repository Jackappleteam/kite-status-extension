name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: node scripts/check.js

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build extension zip
        run: |
          mkdir dist
          zip -r dist/kite-bot-status.zip manifest.json icons src README.md
      - uses: actions/upload-artifact@v7
        with:
          name: kite-bot-status
          path: dist/kite-bot-status.zip
